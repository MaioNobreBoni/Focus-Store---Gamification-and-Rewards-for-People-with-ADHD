<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Missão</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="main-container">
        <div class="container">
            <a href="index.html" class="voltar">voltar</a>
            <h1>Criar Nova Missão</h1>
            <form id="criarForm">
                <label for="titulo">Título da Missão:</label>
                <input type="text" id="titulo" maxlength="37" required>

                <label for="premio">Prêmio</label>
                <input type="number" id="premio" min="1" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" maxlength="200" required></textarea>

                <div class="radio-area">
                    <label for="mini" id="label-radio">É uma mini-meta?</label>
                    <label id="labelRU">Sim
                    <input type="radio" name="mini" placeholder="Sim" value="sim" required>
                    </label>
                    <label id="labelRU">Não
                    <input type="radio" name="mini" placeholder="Não" value="não" required>
                    </label>
                </div>
                <button type="submit" class="botãoCF">Criar Missão</button>
            </form>
        </div>
    </div>
    <script type="module" src="js/scripts_criar.js"></script>
</body>
</html>
